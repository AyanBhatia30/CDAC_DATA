<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table>
        <form>
            <tr>
                <td><label for="nm">name:</label></td>
                <td><input type="text" id="nm" name="name" placeholder="Enter your name" required minlength="3"
                        maxlength="8" size="50" /></td>
            </tr>
            <tr>
                <td><label for="em">email Address:</label></td>
                <td><input type="email" id="em" name="email" placeholder="Enter your email" required /></td>
            </tr>
            <tr>
                <td><label for="age">Age:</label></td>
                <td><input type="number" id="age" name="age" placeholder="Enter your age" required min="16" max="60" />
                </td>
            </tr>
            <tr>
                <td><label for="dt">Joining date:</label></td>
                <td><input type="date" id="dt" name="jdate" min="2026-10-01" max="2026-11-30" /></td>
            </tr>
            <tr>
                <td><label for="addr">Address:</label></td>
                <td><textarea id="addr" name="addr" rows="4" cols="50" placeholder="Enter your address"
                        required></textarea></td>
            </tr>
            <tr>
                <td><label for="gender">Gender:</label></td>
                <td><input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female" checked>
                    <label for="female">Female</label>
                </td>
            </tr>
            <tr>
                <td><label for="degree">Degree:</label></td>
                <td><input type="radio" id="BE" name="degree" value="BE" checked>
                    <label for="BE">BE</label>
                    <input type="radio" id="BTECH" name="degree" value="BTECH">
                    <label for="BTECH">BTECH</label>
                    <input type="radio" id="MTECH" name="degree" value="MTECH">
                    <label for="MTECH">MTECH</label>
                </td>
            </tr>
            <tr>
                <td><label for="city">City:</label></td>
                <td><select id="city" name="city">
                        <option value="test">----Select city-----</option>
                        <option value="pune">Pune</option>
                        <option value="mumbai">Mumbai</option>
                        <option value="banglore">Banglore</option>
                        <option value="delhi" >Delhi</option>
                    </select></td>
            </tr>
            <tr>
                <td></td>
                <td><button type="submit" id="submitbtn" name="submitbtn" value="submit">Submit</button></td>
            </tr>


        </form>
    </table>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- label for attribute -->
    <label for="name">Name</label> 
    <input type="text" name="nm" id="name"/>

    <!-- if you don't want to use label, then use aria-label  -->
     <input aria-label="name" type="text" name="nm" id="name"/>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Course Cards</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-6">

    <h1 class="text-3xl font-bold text-center mb-8">
        Our Courses
    </h1>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <div class="bg-white rounded-xl shadow-md p-5">
            <h2 class="text-xl font-bold text-blue-700">Python</h2>
            <p class="mt-3 text-gray-600">
                Learn Python programming from the basics.
            </p>
            <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg">
                Learn More
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-md p-5">
            <h2 class="text-xl font-bold text-green-700">Java</h2>
            <p class="mt-3 text-gray-600">
                Learn object-oriented programming using Java.
            </p>
            <button class="mt-4 bg-green-600 text-white px-4 py-2 rounded-lg">
                Learn More
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-md p-5">
            <h2 class="text-xl font-bold text-purple-700">Web Design</h2>
            <p class="mt-3 text-gray-600">
                Build attractive websites using HTML and Tailwind.
            </p>
            <button class="mt-4 bg-purple-600 text-white px-4 py-2 rounded-lg">
                Learn More
            </button>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function myfunction(a,b,c){
            console.log(`In myfunction : ${a},${b}, ${c}`)
            console.log(arguments)
        }
        myfunction(12,23,45)
        const f1=function(x,y){
            console.log(`in f1 function ${x} , ${y}`)
             console.log(arguments)
        }
        f1(23,45)
        const f2=(a=10,b=20)=>{
            console.log(`in f2 function ${a} , ${b}`)
        }
        f2();
        const f3=(a=10,b=20,...c)=>{
            console.log(`in f2 function ${a} , ${b}`)
            for(var i=0;i<c.length;i++){
                console.log(`${i}`)
            }
            for(var i of c){
                console.log(`${i}`)
            }
            c.forEach(num=>document.write(`${num}`))
        }
        f3(1,2,3,4,5,6,7,8,9);


       
    </script>
</body>
</html>

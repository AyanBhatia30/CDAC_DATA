<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function addnumbers(ev){
            //console.log(ev)
            console.log(ev.target.name+","+ev.target.id)
            var n1=parseInt(document.getElementById("n1").value)
            var n2=parseInt(document.getElementById("n2").value)
            var sum=n1+n2;
           // alert("Sum of "+n1+" and "+n2+" is "+sum)   
            document.getElementById("result").innerHTML = "Sum of "+n1+" and "+n2+" is "+sum;
        }
        function subnumbers(ev){
            //console.log(ev)
            console.log(ev.target.name+","+ev.target.id)
            var n1=parseInt(document.getElementById("n1").value)
            var n2=parseInt(document.getElementById("n2").value)
            var sub=n1-n2;
           // alert("Subtraction of "+n1+" and "+n2+" is "+sub)   
            document.getElementById("result").innerHTML = "Subtraction of "+n1+" and "+n2+" is "+sub;
        }
    </script>
    <style>
        input[type=text]:focus {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <form>
    <table>
        <tr>
            <td><label for="n1">Number 1:</label></td>
            <td><input type="text" id="n1" name="num1" autofocus required pattern="[0-9]+"/></td>
        </tr>
        <tr>
            <td><label for="n2">Number 2:</label></td>
            <td><input type="text" id="n2" name="num2" required pattern="[0-9]+"/></td>
        </tr>
        <tr>
            <td></td>
            <td>
            <button type="button" id="addBtn" name="btn" onclick="addnumbers(event)">Addition</button>
            <button type="button" id="subBtn" name="btn" onclick="subnumbers(event)">Subtraction</button>
            <button type="reset" id="resetbtn" name="btn">Cancel</button>
            </td>
        </tr>
    </table>
    </form>
    <div id="result"></div>
</body>
</html>

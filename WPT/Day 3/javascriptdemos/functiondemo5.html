    <script>
        
        function combination(n,r){
            //closure function
            function factorial(n){
                var f=1;
                    for(var i=1;i<=n;i++){
                        
                        f=f*i;
                    }
                    return f;
            }
            //calculate n factorial
            var ans=factorial(n);
            var ans1=factorial(n-r) 
    
            return ans/ans1;
        }
    
        //self calling function are called only once

        console.log(`${x} , ${y}`)

    </script>
